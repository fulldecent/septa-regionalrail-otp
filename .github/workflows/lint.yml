name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Prettier & Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Check formatting (Prettier)
        run: npx prettier@3.9.10 --check .
      - name: Check Markdown (markdownlint)
        run: npx markdownlint-cli@0.50.0 "**/*.md"
